[project]
name = "utd-mcp"
version = "0.1.0"
description = "MCP server for UTD: lets Claude and other MCP clients read and work the task board through the REST API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp[cli]>=2,<3",
]

[project.scripts]
utd-mcp = "utd_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utd_mcp"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]
